<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Karaoké</title>

  <link rel="stylesheet" href="style.css">
</head>
<body class="projector-lowres">

<h1>Karaoké La Marsange</h1>

<input
  type="text"
  id="search"
  placeholder="Rechercher une chanson ou un artiste..."
>

<div id="songs"></div>

<div id="lyricsPage" class="hidden">

  <button id="backBtn">← Retour</button>

  <div id="topBar">
    <button id="scrollSlow">🐢 Lent</button>
    <button id="scrollMedium">🚶 Moyen</button>
    <button id="scrollFast">🏃 Rapide</button>
    <button id="scrollStop">⏸ Stop</button>
    <button id="fullscreenBtn">⛶ Plein écran</button>
  </div>

  <h2 id="songTitle"></h2>
  <h3 id="songArtist"></h3>

  <div id="lyrics"></div>

</div>

  <div id="lyrics"></div>

</div>

<script src="app.js"></script>
